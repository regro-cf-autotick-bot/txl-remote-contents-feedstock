{% set python_min = "3.10" %}
{% set name = "txl-remote-contents" %}
{% set version = "0.3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/txl_remote_contents-{{ version }}.tar.gz
  sha256: b9a836146c4b25b627cf4dbacb469dc5a3f23fafafda3147446fba2fa4973fcb

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
  run:
    - python >={{ python_min }}
    - txl =0.3.2
    - httpx >=0.23.1
    - httpx-ws >=0.4.2
    - pycrdt >=0.10.9,<0.11.0
    - pycrdt-websocket >=0.15.3,<0.16.0
    - jupyter_ydoc >=3.0.2,<4.0.0

test:
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
  imports:
    - txl_remote_contents

about:
  home: https://github.com/davidbrochart/jpterm/blob/main/plugins/remote_contents
  summary: TXL plugin for remote contents
  dev_url: https://github.com/davidbrochart/jpterm/blob/main/plugins/remote_contents
  license_file: LICENSE.txt
  license: MIT
  license_family: MIT

extra:
  recipe-maintainers:
    - davidbrochart
